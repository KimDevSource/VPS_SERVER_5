name: Windows-11-3Hours

on: 
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'วางโค้ดจาก Chrome Remote Desktop'
        required: true
      pincode:
        description: 'ตั้งรหัส PIN 6 หลัก'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: เตรียมระบบและติดตั้ง Chrome Remote Desktop
        run: |
          Invoke-WebRequest -Uri https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi -OutFile chromeremotedesktophost.msi
          Start-Process msiexec.exe -ArgumentList '/i chromeremotedesktophost.msi /qn' -Wait

      - name: เริ่มการเชื่อมต่อด้วย PowerShell
        shell: powershell
        run: |
          # คำสั่งที่ได้รับจาก Input จะถูกรันที่นี่
          ${{ github.event.inputs.auth_code }} --pin=${{ github.event.inputs.pincode }}

      - name: รันระบบต่อเนื่อง 3 ชั่วโมง
        run: |
          Write-Host "--- VPS เริ่มทำงานแล้ว (ระยะเวลา 3 ชั่วโมง) ---"
          $minutes = 180
          while($minutes -gt 0) {
            Write-Host "เหลือเวลาอีก: $minutes นาที..."
            Start-Sleep -Seconds 60
            $minutes--
          }
          Write-Host "หมดเวลา 3 ชั่วโมงแล้ว ระบบกำลังปิดตัว"
